<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人頁面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        img {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 50%;
            border: 5px solid #4CAF50;
        }
        h1 {
            color: #333;
        }
        p {
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>歡迎來到我的個人頁面！</h1>
        <!-- 將 src 屬性中的 'your-photo.jpg' 替換為您的照片檔案路徑 -->
        <img src="your-photo.jpg" alt="我的照片">
        <p>這是我的個人頁面，我喜歡分享我的經歷和故事！</p>
    </div>

</body>
</html>
